<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Furniture AI Designer — параметрическое проектирование корпусной мебели, 3D и взрывные схемы.">
  <title>Furniture AI Designer</title>
  <link rel="stylesheet" href="./styles.css">
  <script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
</head>
<body>
  <header class="topbar">
    <div class="brand"><div class="logo">F</div><div><strong>Furniture AI Designer</strong><small>Проектирование корпусной мебели</small></div></div>
    <div class="toolbar">
      <button id="newProject">Новый проект</button>
      <button id="saveProject">Сохранить JSON</button>
      <label class="file-button">Загрузить JSON<input id="loadProject" type="file" accept=".json"></label>
    </div>
  </header>

  <main class="layout">
    <aside class="sidebar">
      <section>
        <h2>Параметры шкафа</h2>
        <label>Ширина, мм<input id="width" type="number" min="200" step="1" value="2400"></label>
        <label>Высота, мм<input id="height" type="number" min="200" step="1" value="2200"></label>
        <label>Глубина, мм<input id="depth" type="number" min="200" step="1" value="600"></label>
        <label>Толщина, мм<input id="thickness" type="number" min="8" step="1" value="18"></label>
        <label>Секций<input id="sections" type="number" min="1" max="12" step="1" value="3"></label>
        <label>Съёмных полок<input id="shelves" type="number" min="0" max="30" step="1" value="6"></label>
        <label>Фасадов<input id="doors" type="number" min="0" max="12" step="1" value="3"></label>
        <div class="row">
          <button class="primary" id="build">Построить</button>
          <button id="explode">Взрыв</button>
        </div>
        <div class="row">
          <button id="resetExplode">Собрать</button>
          <button id="frontView">Фасад</button>
          <button id="isoView">Изометрия</button>
        </div>
      </section>

      <section>
        <h2>Материал</h2>
        <select id="material">
          <option value="ldsp18">ЛДСП 18 мм</option>
          <option value="ldsp16">ЛДСП 16 мм</option>
          <option value="mdf18">МДФ 18 мм</option>
          <option value="ply18">Фанера 18 мм</option>
        </select>
        <h2>Кромка</h2>
        <select id="edge">
          <option>ABS 2 мм</option>
          <option>ABS 1 мм</option>
          <option>PVC 2 мм</option>
          <option>PP 1 мм</option>
          <option>Без кромки</option>
        </select>
      </section>

      <section>
        <h2>Проверка</h2>
        <div id="validation" class="validation">Готово к построению.</div>
      </section>
    </aside>

    <section class="stage">
      <div class="stage-head"><span id="projectName">Новый шкаф</span><span id="status">Параметрическая модель</span></div>
      <div id="viewer"></div>
      <div class="hint">ЛКМ — выбор · ПКМ/Shift — вращение/панорамирование · колесо — масштаб</div>
    </section>

    <aside class="parts">
      <div class="parts-head"><h2>Детали <span id="partsCount">0</span></h2></div>
      <div id="partsList"></div>
    </aside>
  </main>

  <footer class="statusbar">
    <span>Furniture AI Designer v0.1</span>
    <span id="summary">—</span>
  </footer>

  <script type="module" src="./app.js"></script>
</body>
</html>
